<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="stylesheet" href="ChiyaBaganWebsite/src/output.css">
   
    <title>Hare Krishna</title>
</head>
<body>
   <nav class="max-sm:hidden">
    <div class="flex justify-around px-5 py-2">
        <div class="w-24">
            
            <div class="rounded-full aspect-square w-10 border-2 border-purple-500 overflow-hidden">
                <img src="icon.png" class="size-10" alt="logo">
            </div>
        </div>
        <div>
            <ul class="flex gap-5 rounded-full shadow-lg px-10 py-2 justify-center items-center">
                <li>Home</li>
                <li class="text-purple-500">Projects</li>
                <li>About Me</li>
            </ul>
        </div>
        <div class="w-24 text-right">
            <button class="bg-green-600 h-full text-white border border-purple-600 rounded-full px-4 hover:transition duration-200 hover:text-purple-700 hover:bg-white">Contact</button>
        </div>
    </div>
</nav>
<nav  id="Nav" class="sm:hidden absolute top-0 w-full">
   <div class="flex justify-between px-8 py-2">
        <div class="w-24">
            
            <div class="rounded-full aspect-square w-10 border-2 border-purple-500 overflow-hidden">
                <img src="icon.png" class="size-10" alt="logo">
            </div>
        </div>
       
        <div onclick="showmenu()">
          <svg class="size-8  group-hover:fill-[#66ffd6] " xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24">
                                <path
                                    d="M3 13h18c0.552 0 1-0.448 1-1s-0.448-1-1-1h-18c-0.552 0-1 0.448-1 1s0.448 1 1 1zM3 7h18c0.552 0 1-0.448 1-1s-0.448-1-1-1h-18c-0.552 0-1 0.448-1 1s0.448 1 1 1zM3 19h18c0.552 0 1-0.448 1-1s-0.448-1-1-1h-18c-0.552 0-1 0.448-1 1s0.448 1 1 1z">
                                </path>
                            </svg>
        </div>
    </div>
</nav>
<div id="Menu" class="hidden absolute top-0 w-full backdrop-blur-sm  h-[100vh]">
    <div class="flex justify-between px-8 py-2">
        <div class="w-24  flex items-center">
            
            <div class=" rounded-full aspect-square w-10 border-2 border-purple-500 overflow-hidden">
                <img src="icon.png" class="size-10" alt="logo">
            </div>
        </div>
       
        <div onclick="hidemenu()" class=" flex items-center font-bold">
        <p class="rotate-45 text-5xl">+</p>
        </div>
    </div>

    <div class="text-center text-3xl pt-5">
        <ul class="flex flex-col gap-5 text-3xl">
            <li class="text-2xl">Home</li>
            <li class="text-purple-600 text-2xl">Projects</li>
            <li class="text-2xl">About Me</li>
        </ul>
    </div>
</div>

   <div class="h-[70vh] max-md:pt-24 flex justify-center items-center">
<div class=" rounded-4xl px-4  py-8 shadow-[0_5px_100px_rgba(0,0,0,0.3)] text-center">
<h1 class="text-2xl font-semibold">First Project</h1>
<div class="flex justify-center"><img src="images/Logo.png" class="w-64" alt=""></div>
<div class="flex gap-5 flex-col pt-4  md:flex-row">
    <div class="flex-1/2">
        <p class="w-72">Only Frontend - that I made</p>
        <button onclick="window.location=`./ChiyaBaganWebsite/index.html`" class="text-xl py-2 bg-white text-purple-600 border mt-1 border-purple-600 rounded-full px-6 hover:transition duration-200 hover:text-white hover:bg-green-600">View</button>
    </div>
    <div class="flex-1/2">
        <p class="w-72">Full Website - that is live</p>
        <button onclick="window.location=`https://chiyabagan.com/`"  class=" text-xl py-2 bg-white text-purple-600 border mt-1 border-purple-600 rounded-full px-6 hover:transition duration-200 hover:text-white hover:bg-green-600">View</button>
    </div>
</div>
</div>
   </div>



   <script>
    function showmenu(){
        const menu = document.getElementById("Menu")
        const nav= document.getElementById("Nav")
        menu.classList.remove('hidden')
        nav.classList.add('hidden')
    }

    function hidemenu(){
        const menu = document.getElementById("Menu")
        const nav= document.getElementById("Nav")
        menu.classList.add('hidden')
        nav.classList.remove('hidden')
    }
   </script>
</body>
</html>
